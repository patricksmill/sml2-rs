[package]
name = "sml2-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
sml2-dx = { path = "../sml2-dx" }
sml2-core = { path = "../sml2-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
minifb = "0.28"

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
