[package]
name = "sml2-desktop"
version.workspace = true
edition = "2021"
license.workspace = true

[features]
default = ["native"]
native = ["dep:eframe", "dep:wgpu", "dep:gilrs", "dep:png", "dep:rfd", "dep:objc2", "dep:objc2-foundation", "dep:objc2-game-controller", "dep:block2"]

[[bin]]
name = "sml2"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
sml2-dx = { path = "../sml2-dx" }
rfd = { version = "0.15", optional = true }
sml2-core = { path = "../sml2-core" }
sml2-extract = { path = "../sml2-extract" }
sml2-runtime = { path = "../sml2-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"], optional = true }
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles", "dx12", "metal", "wgsl"], optional = true }
png = { version = "0.17", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
gilrs = { version = "0.11", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSString", "NSObject", "NSNotification", "NSOperation", "block2"] }
objc2-game-controller = { version = "0.3", optional = true, default-features = false, features = ["std", "GCController", "GCDevice", "GCPhysicalInputProfile", "GCExtendedGamepad", "GCControllerElement", "GCControllerButtonInput", "GCControllerDirectionPad", "GCControllerAxisInput", "block2"] }
block2 = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"
