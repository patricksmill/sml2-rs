name: Release Build

# A `v*` tag builds and publishes a release with one game executable per
# platform. A manual run builds and uploads the same files as workflow
# artifacts without publishing anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Verification Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install stable Rust
        run: rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Core unit tests
        run: cargo test -p sml2-core

      - name: Desktop policy tests
        run: cargo test --locked -p sml2-desktop --no-default-features --lib

  build:
    name: Build ${{ matrix.asset }}
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            binary: sml2.exe
            asset: six-golden-coins-windows-x64.exe
          # 22.04's older glibc keeps the binary running on older distros.
          - os: ubuntu-22.04
            binary: sml2
            asset: six-golden-coins-linux-x86_64
          - os: macos-14
            binary: sml2
            asset: six-golden-coins-macos-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install stable Rust
        run: rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the game
        run: cargo build --locked --release -p sml2-desktop --bin sml2

      - name: Check startup
        shell: bash
        run: target/release/${{ matrix.binary }} --help

      - name: Stage executable
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download executables
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - <<'EOF'
          import os, re
          tag = os.environ['GITHUB_REF_NAME']
          content = open('CHANGELOG.md').read()
          pattern = r'## \[[vV]?' + re.escape(tag.lstrip('vV')) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          notes = match.group(1).strip() if match else 'Release ' + tag
          open('release_notes.md', 'w').write(notes + '\n')
          EOF
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Six Golden Coins $GITHUB_REF_NAME" \
            --notes-file release_notes.md
